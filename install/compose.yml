# Установка из готового образа: исходный код не нужен.
# Рядом с этим файлом должен лежать .env (образец — .env.example).
#
#   docker compose up -d          запуск
#   docker compose pull && docker compose up -d     обновление
# Имя проекта задано явно: из папки с русским названием Docker его не выведет. Второй
# установке на той же машине дайте своё: COMPOSE_PROJECT_NAME в её .env (иначе она
# пересоздаст контейнер первой).
name: podyachiy

services:
  podyachiy:
    # :latest — последняя сборка; чтобы закрепить версию, впишите её в .env: IMAGE_TAG=1.2.0
    image: egordoronchenko/podyachiy:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      # время в логах и журнале — местное, иначе контейнер живёт по UTC
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # BIND — на каком адресе машины слушать. 127.0.0.1 — только с этого компьютера;
      # 0.0.0.0 — из локальной сети, по адресу вида http://192.0.2.10:8081.
      # В интернет сервис публиковать нельзя.
      - "${BIND:-127.0.0.1}:${PORT:-8081}:8080"
    volumes:
      # Входная папка: сервис читает записи и кладёт сюда загруженные через страницу.
      # Существующие файлы он не меняет и не удаляет. Чтобы запретить запись совсем,
      # допишите в конец строки :ro — кнопка загрузки на странице тогда исчезнет.
      - "${HOST_INBOX:-./inbox}:/data/inbox"
      - "${HOST_OUTBOX:-./outbox}:/data/outbox"
      # Папка состояния: база сервиса (пользователи, права, расходы, журнал обработки) и ключ
      # подписи входов. Только локальный диск сервера, по сети не раздают: в ней хеши паролей.
      # Без неё сервис не запустится.
      - "${HOST_STATE:-./state}:/data/state"
      # Сюда команда резервной копии кладёт архивы (install/README.md, раздел 12). Лучше —
      # другой диск: HOST_BACKUP в .env.
      - "${HOST_BACKUP:-./backup}:/data/backup"
      # Шаблоны протоколов и словарь терминов: при первом запуске сервис сам
      # кладёт сюда исходные файлы, дальше их правят в обычном редакторе.
      - "${HOST_PROMPTS:-./prompts}:/app/prompts"
    # Имя host.docker.internal — сама машина, на которой стоит Docker: по нему сервис
    # достаёт до локальной текстовой модели (LM Studio). В Docker Desktop имя есть
    # и так, на Linux его даёт эта строка.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # без проверки Docker считает контейнер живым, пока жив процесс:
    # приложение внутри могло встать, а «Up» продолжал бы висеть
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    # логи контейнера тоже растут без предела, если их не ограничить
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------------------
  # HTTPS — ВЫКЛЮЧЕНО. Прокси Caddy принимает людей по https:// и передаёт запросы сервису.
  # Пока блок закомментирован, сервис работает по HTTP, как и раньше.
  #
  # Чтобы включить (подробно — install/README.md, раздел «Включить HTTPS»):
  #   1. Положите рядом с этим файлом Caddyfile (образец — Caddyfile.example), а для
  #      сертификата от центра сертификации организации — ещё папку certs с двумя файлами:
  #      certs/podyachiy.crt (сертификат с цепочкой) и certs/podyachiy.key (закрытый ключ).
  #   2. Уберите решётку и один пробел после неё в начале каждой строки ниже, от «caddy:»
  #      до конца блока. Отступы должны остаться: «caddy:» — на одном уровне с «podyachiy:».
  #   3. В .env: BIND=127.0.0.1 (сам сервис из сети больше не виден — только через прокси)
  #      и PUBLIC_URL=https://имя-сервера.
  #   4. docker compose up -d
  #
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   depends_on:
  #     - podyachiy
  #   ports:
  #     # 443 — HTTPS. 80 — только чтобы перевести человека с http:// на https://
  #     # (и для получения сертификата Let's Encrypt, если он используется).
  #     - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
  #     - "${HTTPS_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
  #   volumes:
  #     - "./Caddyfile:/etc/caddy/Caddyfile:ro"
  #     # сертификат и закрытый ключ от центра сертификации организации
  #     - "./certs:/certs:ro"
  #     # здесь Caddy хранит своё: выпущенные им сертификаты и корневой сертификат
  #     # внутреннего центра. Папку не удалять и по сети не раздавать.
  #     - "./caddy/data:/data"
  #     - "./caddy/config:/config"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   # Для входа через домен (install/README.md, раздел 10а): постоянный адрес прокси. Его
  #   # называют сервису в .env — FORWARDED_ALLOW_IPS=172.31.250.2, — и сервис верит только ему,
  #   # что человек пришёл по HTTPS. Чтобы включить, уберите решётку и пробел ещё раз — в трёх
  #   # строках ниже и в пяти последних строках файла.
  #   # networks:
  #   #   default:
  #   #     ipv4_address: 172.31.250.2
#
# # Для входа через домен: подсеть, в которой у прокси постоянный адрес. Занята — возьмите
# # другую свободную и поправьте адрес прокси выше и FORWARDED_ALLOW_IPS в .env.
# # networks:
# #   default:
# #     ipam:
# #       config:
# #         - subnet: 172.31.250.0/24
