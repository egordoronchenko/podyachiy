# Собирает образ сервиса из этого репозитория и публикует его на Docker Hub.
# Нужны два секрета репозитория: DOCKERHUB_USERNAME и DOCKERHUB_TOKEN (Settings → Secrets).
#   тег vX.Y.Z    → :X.Y.Z, :X.Y и :latest — установка по умолчанию берёт :latest, а номером
#                   её можно закрепить и откатить; предварительный выпуск (v1.2.0-rc1) :latest не двигает
#   вручную (Run workflow) с ветки master → :latest
# Обычный пуш в master образ не публикует — только тесты (tests.yml).
# Образ публикуется, только если в нём проходят тесты.
name: Образ

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Вход до первой сборки: базовый образ python тянется с Docker Hub, а без входа
      # общий адрес GitHub быстро упирается в лимит запросов (ошибка 429).
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Дата сборки и короткий идентификатор коммита — в раздел «О сервисе» (ARG в Dockerfile).
      - id: stamp
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Собрать образ для проверки
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: podyachiy:test
          build-args: |
            BUILD_DATE=${{ steps.stamp.outputs.date }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Тесты внутри образа
        run: >
          docker run --rm -v "$PWD:/w" -w /w podyachiy:test
          sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: egordoronchenko/podyachiy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_DATE=${{ steps.stamp.outputs.date }}
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
          labels: ${{ steps.meta.outputs.labels }}
          # Аттестации сборки не публикуются: открытые, они раскрывают, как и из чего собран образ
          # (адреса, параметры и окружение сборки), а установке не нужны.
          provenance: false
          sbom: false
          cache-from: type=gha
