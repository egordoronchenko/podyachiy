<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подьячий — поручения</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="three">

<div class="shell">
<aside class="c1" id="side"></aside>
<main class="page">

<div class="wrap">
  <h1 class="pagetitle">Поручения</h1>

  <form class="card" id="filter" aria-label="Отбор поручений">
    <div class="tfilter">
      <div><label for="fdir">Папка (с подпапками)</label>
        <select id="fdir" name="dir"><option value="">Все открытые мне</option></select></div>
      <div><label for="fwho">Ответственный</label>
        <input type="text" id="fwho" name="who" list="fpeople" autocomplete="off" placeholder="Часть имени">
        <datalist id="fpeople"></datalist></div>
      <div><label for="fsince">Совещания с</label><input type="date" id="fsince" name="since"></div>
      <div><label for="funtil">по</label><input type="date" id="funtil" name="until"></div>
      <div class="wide"><label for="fq">Поиск по тексту</label>
        <input type="search" id="fq" name="q" placeholder="Слова из поручения, срока или названия совещания"></div>
      <div><label for="fsort">Порядок</label>
        <select id="fsort" name="sort">
          <option value="date">Сначала свежие совещания</option>
          <option value="due">По сроку</option>
        </select></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="fdue" name="due">Только со сроком</label>
        <label class="check"><input type="checkbox" id="fopen" name="open" checked>Только незакрытые</label>
        <label class="check"><input type="checkbox" id="fover" name="overdue">Только просроченные</label>
      </div>
    </div>
  </form>

  <div class="card">
    <div class="tbar">
      <div class="count" id="count" role="status" aria-live="polite">Загружаю…</div>
      <button type="button" class="ghost" id="reset" hidden>Сбросить отбор</button>
      <a class="linkbtn" id="csv" href="/api/v1/tasks.csv" title="Те же строки с тем же отбором — файлом для Excel"></a>
    </div>
    <div id="list"></div>
  </div>
</div>

</main>
</div>

<!-- результат отметки: строка внизу с кнопкой отмены, а для экранного диктора — отдельная область -->
<div class="toast tundo" id="toast" hidden><span id="said"></span><button type="button" id="undo">Отменить</button></div>
<div class="vh" id="live" role="status" aria-live="polite"></div>

<script src="/static/common.js"></script>
<script>
/* Реестр поручений: задачи из протоколов всех записей, которые человеку открыты.
   Отбор живёт в адресе страницы — ссылку с ним можно сохранить или отправить коллеге.
   «Только незакрытые» включено, пока человек сам не снял: в адресе тогда open=false. */
const FIELDS = ["dir", "who", "since", "until", "q", "sort"];
const PAGE = 300;                 // строк за раз: дальше — кнопкой, чтобы страница не тормозила
const UNDO_SEC = 8;
const form = document.getElementById("filter");
let rows = [], records = 0, total = 0, stillOpen = 0, shown = PAGE, timer = null, seq = 0;
let noteAt = null;                // строка, у которой сейчас открыто поле комментария
let dueAt = null;                 // строка, у которой сейчас открыто поле срока
let last = null, undoTimer = null;

initSidebar("tasks");
initTheme();
document.getElementById("csv").innerHTML = icon("copy", 15) + "Скачать CSV";

// отбор для запроса к сервису
function state() {
  const p = new URLSearchParams();
  for (const f of FIELDS) {
    const v = form.elements[f].value.trim();
    if (v && !(f === "sort" && v === "date")) p.set(f, v);
  }
  if (form.elements.due.checked) p.set("due", "true");
  if (form.elements.open.checked) p.set("open", "true");
  if (form.elements.overdue.checked) p.set("overdue", "true");
  return p;
}

// он же для адреса страницы: «только незакрытые» — по умолчанию, в адрес идёт лишь отказ от него
function address() {
  const p = state();
  if (p.has("open")) p.delete("open"); else p.set("open", "false");
  return p;
}

function fill(p) {
  for (const f of FIELDS) form.elements[f].value = p.get(f) || (f === "sort" ? "date" : "");
  form.elements.due.checked = p.get("due") === "true";
  form.elements.open.checked = p.get("open") !== "false";
  form.elements.overdue.checked = p.get("overdue") === "true";
}

const day = d => d ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : "";
const recUrl = (r, t) => "/?" + new URLSearchParams({ path: r.dir, open: r.file, ...(t == null ? {} : { t }) });

function doneCell(r, i) {
  if (r.can_mark) return `<label class="tdone"><input type="checkbox" data-done="${i}"${r.done ? " checked" : ""}>
    <span>Выполнено<span class="vh">: ${esc(r.task)}</span></span></label>`;
  return r.done ? `<span class="tdone ro" title="Отмечено выполненным">${icon("ok", 16)}<span>выполнено</span></span>` : "";
}

function statusCell(r, i) {
  let out = r.status ? esc(r.status) : "";
  if (!r.done) return out;
  out += `<span class="sub mark">отмечено: ${esc(r.done_by)}, ${day(r.done_at)}</span>`;
  if (noteAt === i) return out + `<span class="noteform"><input type="text" id="note" maxlength="300"
    aria-label="Комментарий к отметке" placeholder="Комментарий, до 300 знаков" value="${esc(r.comment || "")}">
    <button type="button" data-notesave="${i}">Сохранить</button>
    <button type="button" class="ghost" data-notecancel>Отмена</button></span>`;
  if (r.comment) out += `<span class="sub">${esc(r.comment)}</span>`;
  if (r.can_mark) out += `<button type="button" class="note" data-note="${i}">${
    r.comment ? "изменить комментарий" : "добавить комментарий"}</button>`;
  return out;
}

function count() {
  document.getElementById("count").textContent = total
    ? `Открыто ${stillOpen} из ${total} · просмотрено протоколов: ${records}` : "";
}

function draw() {
  const filtered = [...address().keys()].some(k => k !== "sort");
  document.getElementById("reset").hidden = !filtered;
  count();
  const list = document.getElementById("list");
  if (!rows.length) {
    list.innerHTML = `<div class="tempty">${icon("tasks", 30)}` + (total && form.elements.open.checked
      ? `<p>Незакрытых поручений под этот отбор нет: все ${total} закрыты.</p>
         <button type="button" class="ghost" data-all>Показать и закрытые</button>`
      : filtered
      ? `<p>Под этот отбор ничего не подошло. Протоколов просмотрено: ${records}.</p>
         <button type="button" class="ghost" data-reset>Сбросить отбор</button>`
      : `<p>В протоколах, которые вам открыты, поручений пока нет. Они появятся здесь сами,
         когда сервис обработает запись совещания.</p><a class="linkbtn" style="padding:8px 14px" href="/">К записям</a>`) + `</div>`;
    return;
  }
  list.innerHTML = `<table class="tasks">
    <colgroup><col class="c-done"><col class="c-who"><col><col class="c-due"><col class="c-st"><col class="c-rec"><col class="c-at"></colgroup>
    <thead><tr><th scope="col">Выполнено</th><th scope="col">Ответственный</th><th scope="col">Поручение</th><th scope="col">Срок</th>
      <th scope="col">Статус</th><th scope="col">Совещание</th><th scope="col">В записи</th></tr></thead>
    <tbody>${rows.slice(0, shown).map((r, i) => `<tr class="${r.open ? "" : "closed"}${r.overdue ? " late" : ""}">
      <td class="mk">${doneCell(r, i)}</td>
      <td class="owner${r.who ? "" : " none"}">${esc(r.who || "не назван")}${
        r.absent ? `<span class="sub">не участвовал в совещании</span>` : ""}${
        r.unsigned ? `<a class="sub unsigned" href="${esc(recUrl(r))}"
          title="В протоколе стоит метка голоса, а не имя. Откройте запись и подпишите говорящих на вкладке «Расшифровка с говорящими»">говорящий не подписан</a>` : ""}</td>
      <td class="task">${esc(r.task)}</td>
      <td data-l="Срок" class="duecell">${dueCell(r, i, dueAt === i, r.can_mark)}</td>
      <td data-l="Статус">${statusCell(r, i)}</td>
      <td data-l="Совещание"><a class="ref" href="${esc(recUrl(r))}">${esc(r.title || r.file.split("/").pop())}</a>
        <span class="sub">${day(r.date)}${r.dir ? " · " + esc(r.dir) : ""}</span></td>
      <td data-l="В записи">${r.at_sec == null ? "" : `<a class="ref at" href="${esc(recUrl(r, r.at_sec))}"
        aria-label="Открыть запись на моменте ${r.at}">${r.at}</a>`}</td>
    </tr>`).join("")}</tbody></table>` +
    (rows.length > shown ? `<div class="tmore"><button type="button" class="ghost" data-more>Показать ещё ${
      Math.min(PAGE, rows.length - shown)} из ${rows.length - shown}</button></div>` : "");
}

async function load() {
  const p = state(), mine = ++seq, shownAs = address().toString();
  history.replaceState(null, "", shownAs ? "/tasks?" + shownAs : "/tasks");
  document.getElementById("csv").href = "/api/v1/tasks.csv" + (p.toString() ? "?" + p : "");
  try {
    const d = await api("/api/v1/tasks?" + p);
    if (mine !== seq) return;                 // пока шёл ответ, отбор уже поменяли
    rows = d.tasks; records = d.records; total = d.total; stillOpen = d.open; shown = PAGE; noteAt = null; dueAt = null;
    document.getElementById("fpeople").innerHTML = d.people.map(n => `<option value="${esc(n)}">`).join("");
    draw();
  } catch (e) {
    if (mine !== seq) return;
    document.getElementById("count").textContent = "";
    document.getElementById("list").innerHTML = `<p class="msg err" role="alert">Не удалось загрузить поручения: ${esc(e.message)}</p>`;
  }
}

/* ---------- отметка «выполнено» ----------
   Отметка уходит на сервер сразу. Строка остаётся на месте и при отборе «только незакрытые» —
   пока страницу не обновили или не поменяли отбор: исчезни она под пальцем, отменить ошибочное
   нажатие было бы нечем. Отмена — кнопкой в строке внизу или тем же флажком. */
function tell(text, undo, failed) {
  const box = document.getElementById("toast");
  document.getElementById("said").textContent = text;
  document.getElementById("live").textContent = text + (undo ? " Отменить можно кнопкой «Отменить»." : "");
  document.getElementById("undo").hidden = !undo;
  box.classList.toggle("err", !!failed);
  box.hidden = false;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { box.hidden = true; last = null; }, UNDO_SEC * 1000);
}

const brief = text => text.length > 70 ? text.slice(0, 70).trimEnd() + "…" : text;

async function mark(i, done, comment, undoing) {
  const row = rows[i], before = { done: row.done, comment: row.comment || "" };
  const got = (await api("/api/record/task", { file: row.file, key: row.key, done, comment: comment || "" })).task;
  // одно и то же поручение одной записи может стоять в таблице дважды — отметка у них общая
  for (const r of rows) if (r.file === row.file && r.key === row.key) {
    stillOpen += got.open - r.open;
    Object.assign(r, got);
  }
  noteAt = null;
  draw();
  if (before.done === done) { tell("Комментарий сохранён."); last = null; return; }
  last = undoing ? null : { i, ...before };
  tell((done ? "Отмечено выполненным: " : "Отметка снята: ") + `«${brief(row.task)}»` + (undoing ? " — отменено." : ""), !undoing);
}

async function act(i, done, comment, undoing) {
  try { await mark(i, done, comment, undoing); }
  catch (e) { draw(); tell("Отметка не сохранена: " + e.message, false, true); }
  const box = document.querySelector(`[data-done="${i}"]`);
  if (box) box.focus();
}

/* ---------- срок датой ----------
   Щелчок по сроку открывает поле даты тут же, в строке. Строка остаётся на месте и после правки,
   даже если под отбор («только просроченные») она больше не подходит, — как с отметкой. */
function closeDue() {
  const i = dueAt;
  dueAt = null;
  draw();
  const back = document.querySelector(`[data-due="${i}"]`);
  if (back) back.focus();
}

async function setDue(due) {
  const row = rows[dueAt];
  try {
    const got = (await api("/api/record/task", { file: row.file, key: row.key, due })).task;
    for (const r of rows) if (r.file === row.file && r.key === row.key) Object.assign(r, got);
    closeDue();
    last = null;
    tell((got.due ? `Срок — ${day(got.due)}: ` : "Срок снова как в протоколе: ") + `«${brief(row.task)}»`);
  } catch (e) { tell("Срок не сохранён: " + e.message, false, true); }
}

// папки — те, что человеку открыты; та, что пришла в адресе, остаётся в списке, даже если дерево её не назвало
async function loadFolders(current) {
  const found = [];
  const walk = n => { if (n.path) found.push(n.path); (n.folders || []).forEach(walk); };
  try { walk(await api("/api/v1/tree?depth=8")); } catch (e) {}
  if (current && !found.includes(current)) found.push(current);
  const hidden = me && me.home_root;
  document.getElementById("fdir").innerHTML = `<option value="">Все открытые мне</option>` +
    found.filter(f => f !== hidden).sort((a, b) => a.localeCompare(b, "ru"))
      .map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
  document.getElementById("fdir").value = current;
}

form.addEventListener("submit", e => { e.preventDefault(); load(); });
form.addEventListener("change", load);
// пока человек печатает, запрос не уходит: только после паузы
form.addEventListener("input", e => {
  if (!e.target.matches("input[type=text], input[type=search]")) return;
  clearTimeout(timer);
  timer = setTimeout(load, 350);
});
document.getElementById("list").addEventListener("change", e => {
  const box = e.target.closest("[data-done]");
  if (!box) return;
  box.disabled = true;                       // пока сервер не ответил, второй раз не нажать
  act(+box.dataset.done, box.checked, box.checked ? "" : undefined);
});
document.getElementById("list").addEventListener("keydown", e => {
  if (e.target.id === "duein") {
    if (e.key === "Enter") { e.preventDefault(); if (dueTyped()) setDue(dueTyped()); }
    if (e.key === "Escape") closeDue();
  }
  if (e.target.id !== "note") return;
  if (e.key === "Enter") { e.preventDefault(); act(noteAt, true, e.target.value.trim()); }
  if (e.key === "Escape") { const i = noteAt; noteAt = null; draw(); document.querySelector(`[data-note="${i}"]`).focus(); }
});
document.addEventListener("click", e => {
  if (e.target.closest("#reset, [data-reset]")) { fill(new URLSearchParams()); load(); document.getElementById("fdir").focus(); }
  if (e.target.closest("[data-all]")) { form.elements.open.checked = false; load(); document.getElementById("fopen").focus(); }
  if (e.target.closest("[data-more]")) { shown += PAGE; draw(); }
  const note = e.target.closest("[data-note]");
  if (note) { noteAt = +note.dataset.note; dueAt = null; draw(); document.getElementById("note").focus(); }
  const save = e.target.closest("[data-notesave]");
  if (save) act(+save.dataset.notesave, true, document.getElementById("note").value.trim());
  if (e.target.closest("[data-notecancel]")) { const i = noteAt; noteAt = null; draw(); document.querySelector(`[data-note="${i}"]`).focus(); }
  if (e.target.closest("#undo") && last) act(last.i, last.done, last.comment, true);
  const due = e.target.closest("[data-due]");
  if (due) { dueAt = +due.dataset.due; noteAt = null; draw(); document.getElementById("duein").focus(); }
  if (e.target.closest("[data-duesave]") && dueTyped()) setDue(dueTyped());
  if (e.target.closest("[data-dueclear]")) setDue("");
  if (e.target.closest("[data-duecancel]")) closeDue();
});

const start = new URLSearchParams(location.search);
initUser().then(async () => {
  loadSidebar();
  await loadFolders(start.get("dir") || "");
  fill(start);
  load();
});
</script>
</body>
</html>
