<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подьячий — поручения</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="three">

<div class="shell">
<aside class="c1" id="side"></aside>
<main class="page">

<div class="wrap">
  <h1 class="pagetitle">Поручения</h1>

  <form class="card" id="filter" aria-label="Отбор поручений">
    <div class="tfilter">
      <div><label for="fdir">Папка (с подпапками)</label>
        <select id="fdir" name="dir"><option value="">Все открытые мне</option></select></div>
      <div><label for="fwho">Ответственный</label>
        <input type="text" id="fwho" name="who" list="fpeople" autocomplete="off" placeholder="Часть имени">
        <datalist id="fpeople"></datalist></div>
      <div><label for="fsince">Совещания с</label><input type="date" id="fsince" name="since"></div>
      <div><label for="funtil">по</label><input type="date" id="funtil" name="until"></div>
      <div class="wide"><label for="fq">Поиск по тексту</label>
        <input type="search" id="fq" name="q" placeholder="Слова из поручения, срока или названия совещания"></div>
      <div><label for="fsort">Порядок</label>
        <select id="fsort" name="sort">
          <option value="date">Сначала свежие совещания</option>
          <option value="due">По сроку</option>
        </select></div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="fdue" name="due">Только со сроком</label>
        <label class="check"><input type="checkbox" id="fopen" name="open" checked>Только незакрытые</label>
        <label class="check"><input type="checkbox" id="fover" name="overdue">Только просроченные</label>
      </div>
    </div>
  </form>

  <div class="card">
    <div class="tbar">
      <div class="count" id="count" role="status" aria-live="polite">Загружаю…</div>
      <button type="button" class="ghost" id="reset" hidden>Сбросить отбор</button>
      <a class="linkbtn" id="csv" href="/api/v1/tasks.csv" title="Те же строки с тем же отбором — файлом для Excel"></a>
    </div>
    <div id="list"></div>
  </div>
</div>

</main>
</div>

<!-- результат отметки: строка внизу с кнопкой отмены, а для экранного диктора — отдельная область -->
<div class="toast tundo" id="toast" hidden><span id="said"></span><button type="button" id="undo">Отменить</button></div>
<div class="vh" id="live" role="status" aria-live="polite"></div>

<script src="/static/common.js"></script>
<script src="/static/tasks.js"></script>
</body>
</html>
