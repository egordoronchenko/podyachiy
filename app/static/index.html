<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подьячий — записи</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="three">

<div class="app3">
  <aside class="c1" id="side"></aside>

  <section class="c2" id="c2">
    <div class="hd">
      <nav class="crumbs" id="crumbs" aria-label="Путь по папкам"></nav>
      <div class="hrow">
        <h1 id="folderTitle">Записи</h1>
        <a class="linkbtn" id="tasksbtn" hidden title="Поручения из протоколов этой папки и её подпапок">Поручения</a>
        <button class="ghost" id="dcbtn" hidden aria-haspopup="dialog"
          title="Участники и сокращения этой папки: по ним сервис пишет ФИО и термины в протоколах">Словарь</button>
        <button class="ghost" id="srbtn" hidden aria-haspopup="dialog"
          title="Переносить ли в новый протокол незакрытые поручения предыдущей записи этой папки">Серия<span class="sw" id="srstate"></span></button>
        <button class="ghost" id="acbtn" hidden title="Кому открыта эта папка">Доступ</button>
        <button class="ghost" id="mkbtn" hidden title="Создать подпапку здесь">Новая папка</button>
        <button class="ghost" id="trbtn" aria-haspopup="dialog"
          title="Удалённые записи и папки: их можно вернуть на прежнее место, пока срок хранения не вышел">Корзина</button>
      </div>
      <input type="search" id="q" placeholder="Поиск по всем записям" aria-label="Поиск по протоколам и расшифровкам всех записей">
    </div>
    <div class="list">
      <div id="uploads"></div>
      <div id="results"></div>
      <div id="browse"><div id="dirs"></div><div id="files"></div></div>
    </div>
  </section>

  <section class="c3">
    <div id="blank">
      <div class="blankbox">
        <div class="blankmark"></div>
        <h2>Выберите запись слева</h2>
        <p>Здесь откроются протокол, расшифровка с говорящими и субтитры, а метки времени будут вести на нужный момент записи.</p>
        <p class="dim" id="uphint" hidden>Новую запись можно перетащить мышью в список или загрузить кнопкой слева.</p>
      </div>
    </div>
    <div id="viewer"></div>
  </section>
</div>

<div id="access" hidden></div>
<div id="series" hidden></div>
<div id="recact" hidden></div>
<div id="trash" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/common.js"></script>
<script src="/static/index.js"></script>
</body>
</html>
